name = "form-handler"
main = "src/worker.js"
compatibility_date = "2025-11-01"

[[routes]]
pattern = "api.die-zukunft.ch/*"
zone_name = "die-zukunft.ch"

[[kv_namespaces]]
binding = "FORMS"
id = "bba8fc0a26a54981ae5c716e8808dd18"

[vars]
NOTIFY_FROM = "forms@die-zukunft.ch"
# NOTIFY_TO is a worker secret (`npx wrangler secret put NOTIFY_TO`), not a var: it must be a
# *verified* destination address in Cloudflare Email Routing (a routed address such as
# hey@die-zukunft.ch does not count), and the private inbox stays out of this public repo.

[[send_email]]
name = "EMAIL"
