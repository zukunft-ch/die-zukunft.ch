name = "form-handler"
main = "src/worker.js"
compatibility_date = "2025-11-01"

[[routes]]
pattern = "api.die-zukunft.ch/*"
zone_name = "die-zukunft.ch"

[[kv_namespaces]]
binding = "FORMS"
id = "bba8fc0a26a54981ae5c716e8808dd18"

[vars]
NOTIFY_FROM = "forms@die-zukunft.ch"
# Role address, not a personal inbox. NOTE: destination_address below must be a
# *verified* destination in Cloudflare Email Routing for this zone before deploy,
# otherwise Worker email delivery fails silently. Verify hey@die-zukunft.ch there first.
NOTIFY_TO = "hey@die-zukunft.ch"

[[send_email]]
name = "EMAIL"
destination_address = "hey@die-zukunft.ch"
